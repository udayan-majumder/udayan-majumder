name: Snake Maze Contribution

on:
  schedule:
    - cron: '0 0 * * *'  # every day at midnight UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Python and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install pipreqs

      - name: Generate snake.svg
        run: |
          mkdir -p output
          # Install snake graph generator (example pip package 'snakeify')
          pip3 install snakeify
          snakeify --output output/snake.svg --theme dark

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/snake.svg
          git commit -m "chore: update snake maze [skip ci]" || echo "No changes"
          git push
